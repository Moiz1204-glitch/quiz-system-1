<!DOCTYPE html>
<html>
<head>
<title>School LMS</title>

<style>
body {font-family: Arial; background:#eef2f7; text-align:center;}
.container {background:#fff; padding:20px; width:420px; margin:auto; border-radius:10px;}

button {padding:10px; margin:5px; width:80%; background:#1aaa91; color:#ffffff; border:none; cursor:pointer;}
input, select {padding:10px; margin:5px; width:80%;}

.tabs button {width:45%; background:#2c3e50;}
.activeTab {background:#27ae60 !important;}

#quizBox {display:none;}
#teacherBox {display:none;}

#timer {color:red; font-weight:bold;}

/* LOADER */
#loader {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  color:#fff;
  font-size:20px;
  align-items:center;
  justify-content:center;
}
</style>

</head>

<body>

<div id="loader">⏳ Loading...</div>

<div class="container">

<img src="https://upload.wikimedia.org/wikipedia/commons/5/57/The_Educator_Logo.png" alt="The Educators Logo" align:center; width="100"; height="100";>

<h2>The Educators Taxila Campus</h2> 
  
<h2>📘 LMS System</h2>

<!-- TABS -->
<div class="tabs">
<button id="studentTab" class="activeTab" onclick="showStudent()">Student</button>
<button id="teacherTab" onclick="showTeacher()">Teacher</button>
</div>

<!-- ================= STUDENT PANEL ================= -->
<div id="studentBox">

<h3>Student Panel</h3>

<input id="sname" placeholder="Name"><br>
<input id="sid" placeholder="Roll No"><br>

<select id="teacherSelect">
<option value="">Select Class</option>
</select><br>

<button onclick="startQuiz()">Start Quiz</button>

</div>

<!-- QUIZ -->
<div id="quizBox">
<h3 id="q"></h3>
<div id="opts"></div>
<h4 id="timer"></h4>
</div>

<!-- ================= TEACHER PANEL ================= -->
<div id="teacherBox">

<h3>Teacher Login</h3>

<input id="tid" placeholder="Teacher ID"><br>
<input id="tpass" placeholder="Password"><br>

<button onclick="login()">Login</button>

<div id="dash"></div>

</div>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbwfDrU1-QspaHA2soBpEiPgqPcdSjfaA7ElYxcST48uhUTyYkwPfqu_Bkng3UHSLVh9/exec";

// GLOBAL
let quiz=[], i=0, score=0;
let timer, t=30;
let teacherID="", studentName="", studentID="", currentClass="";

// LOADER CONTROL
function showLoader(){ document.getElementById("loader").style.display="flex"; }
function hideLoader(){ document.getElementById("loader").style.display="none"; }

// ================= TABS =================

function showStudent(){
  studentBox.style.display="block";
  teacherBox.style.display="none";
  studentTab.classList.add("activeTab");
  teacherTab.classList.remove("activeTab");
}

function showTeacher(){
  studentBox.style.display="none";
  teacherBox.style.display="block";
  teacherTab.classList.add("activeTab");
  studentTab.classList.remove("activeTab");
}

// ================= LOAD CLASSES =================

showLoader();

fetch(URL + "?allClasses=true")
.then(res => res.json())
.then(data => {
  let select = document.getElementById("teacherSelect");

  data.forEach(x => {
    let opt = document.createElement("option");
    opt.value = x.teacher + "|" + x.class;
    opt.text = x.class + " (" + x.teacher + ")";
    select.appendChild(opt);
  });

  hideLoader();
});

// ================= STUDENT =================

function startQuiz(){

  let name = sname.value;
  let sidVal = sid.value;
  let val = teacherSelect.value;

  if(!name || !sidVal || !val){
    alert("Fill all fields");
    return;
  }

  let parts = val.split("|");
  teacherID = parts[0];
  currentClass = parts[1];

  studentName = name;
  studentID = sidVal;

  showLoader();

  fetch(URL + `?check=true&teacher=${teacherID}&class=${currentClass}&sid=${studentID}`)
  .then(res => res.json())
  .then(data => {

    if(data.done){
      hideLoader();
      alert("Already attempted");
      return;
    }

    fetch(URL + `?teacher=${teacherID}&class=${currentClass}`)
    .then(res => res.json())
    .then(q => {

      hideLoader();

      quiz = q;
      i=0; score=0;

      studentBox.style.display="none";
      quizBox.style.display="block";

      nextQ();
    });

  });
}

function nextQ(){

  if(i>=quiz.length){ endQuiz(); return; }

  q.innerText = quiz[i].q;
  opts.innerHTML="";

  quiz[i].options.forEach((o,index)=>{
    opts.innerHTML += `<button onclick="answer(${index})">${o}</button>`;
  });

  startTimer();
}

function startTimer(){
  t=30;
  timer=setInterval(()=>{
    timerEl.innerText="Time: "+t;
    t--;
    if(t<0){
      clearInterval(timer);
      i++; nextQ();
    }
  },1000);
}

function answer(x){
  clearInterval(timer);
  if(x===quiz[i].answer) score++;
  i++; nextQ();
}

function endQuiz(){

  quizBox.innerHTML = `<h2>Submitted</h2><h3>${studentName}: ${score}/${quiz.length}</h3>`;

  fetch(URL,{
    method:"POST",
    body: JSON.stringify({
      action:"result",
      teacher: teacherID,
      class: currentClass,
      name: studentName,
      sid: studentID,
      score: score,
      total: quiz.length
    })
  });
}

// ================= TEACHER =================

function login(){

  let id = tid.value;
  let pass = tpass.value;

  if(!id || !pass){
    alert("Enter login");
    return;
  }

  showLoader();

  fetch(URL + `?login=true&id=${id}&pass=${pass}`)
  .then(res => res.json())
  .then(data => {

    hideLoader();

    if(data.success){
      teacherID = id;
      loadDashboard();
    } else {
      alert("Wrong login");
    }
  });
}

function loadDashboard(){

  dash.innerHTML = `
    <button onclick="logout()">Logout</button>

    <h4>Select Class</h4>
    <select id="classSelect"></select>

    <h4>Add Question</h4>
    <input id="q1"><br>
    <input id="o1"><input id="o2"><input id="o3"><input id="o4"><br>
    <input id="ans">
    <button onclick="addQ()">Add</button>

    <h4>Results</h4>
    <div id="res"></div>
  `;

  loadClasses();
}

function loadClasses(){

  fetch(URL + `?getClasses=true&teacher=${teacherID}`)
  .then(res => res.json())
  .then(data => {

    let select = document.getElementById("classSelect");
    select.innerHTML="";

    data.forEach(c=>{
      select.innerHTML += `<option value="${c}">${c}</option>`;
    });

    select.onchange = ()=>{
      currentClass = select.value;
      loadResults();
    };

    currentClass = data[0];
    loadResults();
  });
}

function addQ(){

  fetch(URL,{
    method:"POST",
    body: JSON.stringify({
      action:"add",
      teacher: teacherID,
      class: currentClass,
      q: q1.value,
      o1:o1.value,
      o2:o2.value,
      o3:o3.value,
      o4:o4.value,
      ans:ans.value
    })
  }).then(()=> alert("Added"));
}

function loadResults(){

  fetch(URL + `?results=true&teacher=${teacherID}&class=${currentClass}`)
  .then(res => res.json())
  .then(data => {

    let html="";
    data.forEach(r=>{
      html += `<p>${r.name} (${r.id}) → ${r.score}/${r.total}</p>`;
    });

    res.innerHTML = html;
  });
}

function logout(){
  teacherID="";
  dash.innerHTML="";
  showStudent();
}

</script>

</body>
</html>
