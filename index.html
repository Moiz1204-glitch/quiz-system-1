<!DOCTYPE html>
<html>
<head>
<title>School LMS</title>
<style>
body{font-family:Arial;background:#eef2f7;text-align:center}
.container{background:#fff;padding:20px;width:420px;margin:auto;border-radius:10px}
button{padding:10px;margin:5px;width:80%;background:#3498db;color:#fff;border:none}
input,select{padding:10px;margin:5px;width:80%}
#timer{color:red}
</style>
</head>

<body>
<div class="container">

<h2>📘 LMS System</h2>

<!-- STUDENT -->
<div id="student">
<h3>Student Panel</h3>
<input id="sname" placeholder="Name">
<input id="sid" placeholder="Roll No">
<select id="teacherSelect"></select>
<button onclick="startQuiz()">Start Quiz</button>
</div>

<!-- QUIZ -->
<div id="quiz" style="display:none">
<h3 id="q"></h3>
<div id="opts"></div>
<h4 id="timer"></h4>
</div>

<!-- TEACHER -->
<hr>
<h3>Teacher Panel</h3>
<input id="tid" placeholder="Teacher ID">
<input id="tpass" placeholder="Password">
<button onclick="login()">Login</button>

<div id="dash"></div>

</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbyxQCJfxLkcqSVEsSJ5VchiI85eOyEKMncD6l-SFTjSk6Q6y3DqFT-LF9aQpcRjFkVe/exec";

let quiz=[],i=0,score=0,timer,t=30,teacherID="";

// load teachers
fetch(URL+"?teachers=true")
.then(r=>r.json())
.then(d=>{
d.forEach(x=>{
teacherSelect.innerHTML+=`<option value="${x.id}">${x.name}</option>`
})
})

// student
function startQuiz(){
let name=sname.value,sidv=sid.value,tid=teacherSelect.value;

fetch(URL+`?check=true&teacher=${tid}&sid=${sidv}`)
.then(r=>r.json())
.then(d=>{
if(d.done){alert("Already attempted");return;}

teacherID=tid;
studentName=name;
studentID=sidv;

fetch(URL+`?teacher=${tid}`)
.then(r=>r.json())
.then(q=>{quiz=q;next();});
});
}

function next(){
if(i>=quiz.length){end();return;}
q.innerText=quiz[i].q;
opts.innerHTML="";
quiz[i].options.forEach((o,x)=>{
opts.innerHTML+=`<button onclick="ans(${x})">${o}</button>`;
});
time();
}

function time(){
t=30;
timer=setInterval(()=>{
timerEl.innerText="Time: "+t;
t--;
if(t<0){clearInterval(timer);i++;next();}
},1000);
}

function ans(x){
clearInterval(timer);
if(x==quiz[i].answer)score++;
i++;next();
}

function end(){
quizBox.style.display="none";
fetch(URL,{
method:"POST",
body:JSON.stringify({action:"result",teacher:teacherID,name:studentName,sid:studentID,score:score,total:quiz.length})
});
alert("Submitted");
}

// teacher
function login(){
fetch(URL+`?login=true&id=${tid.value}&pass=${tpass.value}`)
.then(r=>r.json())
.then(d=>{
if(d.success){teacherID=tid.value;panel();}
else alert("Wrong login");
});
}

function panel(){
dash.innerHTML=`
<h4>Add Question</h4>
<input id="q1"><br>
<input id="o1"><input id="o2"><input id="o3"><input id="o4"><br>
<input id="ans"><button onclick="add()">Add</button>
<h4>Results</h4><div id="res"></div>`;
loadRes();
}

function add(){
fetch(URL,{
method:"POST",
body:JSON.stringify({action:"add",teacher:teacherID,q:q1.value,o1:o1.value,o2:o2.value,o3:o3.value,o4:o4.value,ans:ans.value})
});
}

function loadRes(){
fetch(URL+`?results=true&teacher=${teacherID}`)
.then(r=>r.json())
.then(d=>{
let h="";
d.forEach(x=>{
h+=`<p>${x.name} (${x.id}) - ${x.score}/${x.total}</p>`;
});
res.innerHTML=h;
});
}
</script>
</body>
</html>
