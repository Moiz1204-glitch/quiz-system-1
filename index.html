<!DOCTYPE html>
<html>
<head>
<title>School LMS</title>

<style>
body {font-family: Arial; background:#eef2f7; text-align:center;}
.container {background:#1aaa91; padding:20px; width:420px; margin:auto; border-radius:10px;}
button {padding:10px; margin:5px; width:80%; background:#3498db; color:#fff; border:none;}
input, select {padding:10px; margin:5px; width:80%;}
#timer {color:red; font-weight:bold;}
</style>

</head>

<body>

<div class="container">

<h2>📘 LMS System</h2>

<!-- STUDENT PANEL -->
<div id="studentBox">
<h3>Student Panel</h3>
<input id="sname" placeholder="Name"><br>
<input id="sid" placeholder="Roll No"><br>

<select id="teacherSelect">
<option value="">Select Class</option>
</select><br>

<button onclick="startQuiz()">Start Quiz</button>
</div>

<!-- QUIZ -->
<div id="quizBox" style="display:none">
<h3 id="q"></h3>
<div id="opts"></div>
<h4 id="timer"></h4>
</div>

<hr>

<!-- TEACHER PANEL -->
<h3>Teacher Panel</h3>
<input id="tid" placeholder="Teacher ID"><br>
<input id="tpass" placeholder="Password"><br>
<button onclick="login()">Login</button>

<div id="dash"></div>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbzCh9_eCiLfaCBjn7WMruOwXW5N-XpRyTWUF67S-NeoSERxd2z0MqfscusqlOuTBV3F/exec"; // 🔴 PUT YOUR APPS SCRIPT URL HERE

let quiz = [], i = 0, score = 0;
let timer, t = 30;
let teacherID = "", studentName = "", studentID = "";

// 🔹 LOAD TEACHERS DROPDOWN
fetch(URL + "?teachers=true")
.then(res => res.json())
.then(data => {
  let select = document.getElementById("teacherSelect");
  data.forEach(t => {
    let opt = document.createElement("option");
    opt.value = t.id;
    opt.text = t.name;
    select.appendChild(opt);
  });
});

// ================= STUDENT =================

function startQuiz() {

  let name = document.getElementById("sname").value;
  let sidVal = document.getElementById("sid").value;
  let tidVal = document.getElementById("teacherSelect").value;

  if(name === "" || sidVal === "" || tidVal === ""){
    alert("Fill all fields");
    return;
  }

  fetch(URL + "?check=true&teacher=" + tidVal + "&sid=" + sidVal)
  .then(res => res.json())
  .then(data => {

    if(data.done){
      alert("You already attempted this quiz");
      return;
    }

    teacherID = tidVal;
    studentName = name;
    studentID = sidVal;

    document.getElementById("studentBox").style.display = "none";
    document.getElementById("quizBox").style.display = "block";

    fetch(URL + "?teacher=" + teacherID)
    .then(res => res.json())
    .then(q => {
      quiz = q;
      i = 0;
      score = 0;
      nextQuestion();
    });

  });
}

// LOAD QUESTION
function nextQuestion() {

  if(i >= quiz.length){
    endQuiz();
    return;
  }

  document.getElementById("q").innerText = quiz[i].q;

  let optDiv = document.getElementById("opts");
  optDiv.innerHTML = "";

  quiz[i].options.forEach((opt, index) => {
    let btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => answer(index);
    optDiv.appendChild(btn);
  });

  startTimer();
}

// TIMER
function startTimer(){
  t = 30;
  let timerEl = document.getElementById("timer");

  timerEl.innerText = "Time Left: " + t;

  timer = setInterval(() => {
    t--;
    timerEl.innerText = "Time Left: " + t;

    if(t < 0){
      clearInterval(timer);
      i++;
      nextQuestion();
    }
  }, 1000);
}

// ANSWER
function answer(choice){
  clearInterval(timer);

  if(choice === quiz[i].answer){
    score++;
  }

  i++;
  nextQuestion();
}

// END QUIZ
function endQuiz(){

  document.getElementById("quizBox").innerHTML =
    `<h2>Submitted</h2><h3>${studentName}, Score: ${score}/${quiz.length}</h3>`;

  fetch(URL,{
    method:"POST",
    body: JSON.stringify({
      action:"result",
      teacher: teacherID,
      name: studentName,
      sid: studentID,
      score: score,
      total: quiz.length
    })
  });
}

// ================= TEACHER =================

function login(){

  let id = document.getElementById("tid").value;
  let pass = document.getElementById("tpass").value;

  if(id === "" || pass === ""){
    alert("Enter login details");
    return;
  }

  fetch(URL + "?login=true&id=" + id + "&pass=" + pass)
  .then(res => res.json())
  .then(data => {

    if(data.success){
      teacherID = id;
      loadDashboard();
    } else {
      alert("Wrong login");
    }

  });
}

// DASHBOARD
function loadDashboard(){

  document.getElementById("dash").innerHTML = `
    <h4>Add Question</h4>
    <input id="q1" placeholder="Question"><br>
    <input id="o1" placeholder="Option1">
    <input id="o2" placeholder="Option2">
    <input id="o3" placeholder="Option3">
    <input id="o4" placeholder="Option4"><br>
    <input id="ans" placeholder="Correct (1-4)">
    <button onclick="addQ()">Add</button>

    <h4>Results</h4>
    <div id="res"></div>
  `;

  loadResults();
}

// ADD QUESTION
function addQ(){

  fetch(URL,{
    method:"POST",
    body: JSON.stringify({
      action:"add",
      teacher: teacherID,
      q: document.getElementById("q1").value,
      o1: document.getElementById("o1").value,
      o2: document.getElementById("o2").value,
      o3: document.getElementById("o3").value,
      o4: document.getElementById("o4").value,
      ans: document.getElementById("ans").value
    })
  }).then(() => {
    alert("Question Added");
  });
}

// LOAD RESULTS
function loadResults(){

  fetch(URL + "?results=true&teacher=" + teacherID)
  .then(res => res.json())
  .then(data => {

    let html = "";

    data.forEach(r => {
      html += `<p>${r.name} (${r.id}) - ${r.score}/${r.total}</p>`;
    });

    document.getElementById("res").innerHTML = html;
  });
}

</script>

</body>
</html>
